name: build

# Both platforms run the same checks because the platform split lives in the
# source tree, not in a separate branch: a change that builds on macOS but not
# on Windows (or the reverse) has to fail here rather than on someone's laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: Verify the macOS build still compiles for both architectures
        if: runner.os == 'macOS'
        run: |
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vue-tsc + vite build. The output target is pinned to safari15 in
      # vite.config.ts so the same artefact is valid on macOS 12 and Windows 11.
      - run: pnpm build

  shell:
    name: tauri shell (${{ matrix.os }})
    needs: [backend, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Linux needs the WebKitGTK development packages that Tauri links against;
      # the two target platforms need nothing extra.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      # Produces src-tauri/binaries/file-jd-<triple>[.exe], which the Tauri build
      # embeds as the sidecar.
      - run: pnpm backend:build
      - name: Verify the sidecar landed with the right name
        shell: bash
        run: ls -la src-tauri/binaries/
      - run: pnpm tauri build --no-bundle